# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests and app compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v3.2.2
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: SPDX guard
        run: bash scripts/check-spdx.sh
      - name: Tests
        run: ./gradlew --no-daemon :core:test
      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug
